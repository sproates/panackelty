name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify and check documentation
    runs-on: ubuntu-22.04
    outputs:
      route: ${{ steps.scope.outputs.route }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test CI routing and documentation checks
        run: bash tests/ci_scope.sh

      - name: Select validation route
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          route=$(bash scripts/ci_scope.sh "$CI_BASE_SHA" "$CI_HEAD_SHA")
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "Validation route: $route" >> "$GITHUB_STEP_SUMMARY"

      - name: Check informational documents
        if: steps.scope.outputs.route == 'docs'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          git diff --check "$(git merge-base "$CI_BASE_SHA" "$CI_HEAD_SHA")" "$CI_HEAD_SHA" --
          bash scripts/check_docs.sh

  package_build:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.route == 'full' && !cancelled()
    name: Build package (${{ matrix.target }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, macos-arm64]
        suite: [compiler, runtime, bootstrap, conformance-source, conformance-bytecode]
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      VALIDATION_PROFILE_FILE: ${{ github.workspace }}/validation-profile.tsv
      VALIDATION_TIMINGS_FILE: ${{ github.workspace }}/validation-timings.tsv
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate and package with an isolated command environment
        if: needs.changes.result == 'success' && needs.changes.outputs.route == 'full' && !cancelled()
        run: make check-no-interpreter CI_SUITE=${{ matrix.suite }}

      - name: Archive detailed validation profile
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.route == 'full'
        uses: actions/upload-artifact@v6
        with:
          name: validation-profile-${{ matrix.target }}-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            validation-profile.tsv
            validation-timings.tsv
          if-no-files-found: warn

      - name: Record build provenance
        if: matrix.suite == 'conformance-bytecode' && success()
        shell: bash
        run: |
          archive=$(find build -maxdepth 1 -name 'panackelty-*.tar.gz' -print -quit)
          checksum=$(awk '{print $1}' "${archive}.sha256")
          {
            echo "archive=$(basename "$archive")"
            echo "sha256=$checksum"
            echo "source_commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
          } >"${archive}.provenance"

      - name: Upload packaged toolchain
        if: matrix.suite == 'conformance-bytecode' && success()
        uses: actions/upload-artifact@v6
        with:
          name: panackelty-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/panackelty-*.tar.gz
            build/panackelty-*.tar.gz.sha256
            build/panackelty-*.tar.gz.provenance
          if-no-files-found: error
          retention-days: 14

  test_run:
    name: Full validation (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [compiler, runtime, bootstrap, sanitize, coverage]
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.route == 'full' && !cancelled()
    runs-on: ubuntu-latest
    env:
      VALIDATION_PROFILE_FILE: ${{ github.workspace }}/validation-profile.tsv
      VALIDATION_TIMINGS_FILE: ${{ github.workspace }}/validation-timings.tsv
      VALIDATION_PROFILE_RUN: ${{ matrix.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run project checks
        if: contains(fromJSON('["compiler", "runtime", "bootstrap"]'), matrix.suite)
        run: sh tests/profile_command.sh ci/${{ matrix.suite }} make ci-${{ matrix.suite }}

      - name: Check native memory and undefined behaviour
        if: matrix.suite == 'sanitize'
        run: make native-sanitize CC=clang

      - name: Install matching LLVM coverage tools
        if: matrix.suite == 'coverage'
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Measure native branch coverage
        if: matrix.suite == 'coverage'
        run: make native-coverage LLVM_CC=/usr/bin/clang LLVM_COV=/usr/bin/llvm-cov LLVM_PROFDATA=/usr/bin/llvm-profdata

      - name: Archive native coverage
        if: matrix.suite == 'coverage'
        uses: actions/upload-artifact@v6
        with:
          name: native-coverage-${{ github.run_id }}
          path: |
            build/coverage/summary.txt
            build/coverage/html/
          if-no-files-found: error

      - name: Publish validation timing summary
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.route == 'full'
        shell: bash
        run: |
          if [[ ! -f validation-timings.tsv ]]; then
            exit 0
          fi
          {
            echo "### Validation timings"
            echo
            echo "| Phase | Duration | Budget | Status |"
            echo "| --- | ---: | ---: | --- |"
            while IFS=$'\t' read -r phase elapsed budget status; do
              if [[ "$status" == "0" ]]; then
                result="passed"
              else
                result="failed ($status)"
              fi
              echo "| $phase | ${elapsed}s | ${budget}s | $result |"
            done < validation-timings.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive validation timings
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.route == 'full'
        uses: actions/upload-artifact@v6
        with:
          name: validation-timings-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            validation-timings.tsv
            validation-profile.tsv
          if-no-files-found: warn

  # Only these short compatibility gates use always(). Expensive jobs retain
  # normal cancellation, so a superseded PR update does not wait for old builds.
  package:
    name: Package (${{ matrix.target }})
    needs: [changes, package_build]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, macos-arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Report validation result
        env:
          CI_SCOPE_RESULT: ${{ needs.changes.result }}
          CI_SCOPE_ROUTE: ${{ needs.changes.outputs.route }}
          CI_VALIDATION_RESULT: ${{ needs.package_build.result }}
        run: sh scripts/ci_gate.sh

  test:
    needs: [changes, test_run]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Report validation result
        env:
          CI_SCOPE_RESULT: ${{ needs.changes.result }}
          CI_SCOPE_ROUTE: ${{ needs.changes.outputs.route }}
          CI_VALIDATION_RESULT: ${{ needs.test_run.result }}
        run: sh scripts/ci_gate.sh
