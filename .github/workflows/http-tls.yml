name: HTTP TLS fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/http-tls.yml'
      - 'tests/http_client_package.sh'
      - 'tests/http_fixture.c'
      - 'tests/package_https*'
      - 'tests/package_git*'
      - 'tests/fixtures/package_git/**'
      - 'src/packages/**'
      - 'bin/panack'
      - 'Makefile'
      - 'tests/release_archive_smoke.sh'
      - 'src/project_model/package_manifest.panack'
      - 'src/vm/http_transport.c'
      - 'packages/http/**'

permissions:
  contents: read

concurrency:
  group: http-tls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native HTTP client dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev zlib1g-dev libssl-dev
      - name: Build native fixture runner
        run: make native package-tool build/vm/http_fixture
      - name: Exercise TLS source and bytecode contracts
        run: |
          openssl version
          curl-config --version
          for fixture in tls-ok tls-wrong-host tls-untrusted tls-late stream tls-stream tls-stream-untrusted; do
            echo "TLS fixture: $fixture"
            sh tests/http_client_package.sh "$fixture"
          done
      - name: Exercise HTTPS package acquisition
        run: sh tests/package_https.sh
      - name: Exercise installed HTTPS packages without Git or build tools
        run: |
          make release-smoke
          mv build/package/panackelty "$RUNNER_TEMP/relocated toolchain"
          PANACK_INSTALLED_COMMAND="$RUNNER_TEMP/relocated toolchain/bin/panack" sh tests/package_https.sh
      - name: Exercise isolated Git snapshots over HTTPS
        run: sh tests/package_git.sh
