name: Focused nightly diagnostics
on:
  push:
    branches: [ci/nightly-failure-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    name: Artifact DNS probe (${{ matrix.attempt }})
    runs-on: macos-14
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - name: Enable action debug and prepare representative reports
        run: |
          echo 'ACTIONS_STEP_DEBUG=true' >> "$GITHUB_ENV"
          printf 'diagnostic\tcompiler\t-\t31\t0\n' > validation-profile.tsv
          printf 'compiler\t31\t90\t0\n' > validation-timings.tsv
          sw_vers
          scutil --dns
      - name: Upload with the exact action revision and nightly settings
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        env:
          RUNNER_DEBUG: '1'
        with:
          name: nightly-validation-macos-arm64-compiler-${{ github.run_id }}-${{ matrix.attempt }}
          path: |
            validation-profile.tsv
            validation-timings.tsv
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect DNS on the same runner
        if: always()
        uses: ./tests/experiments/nightly-diagnostics/dns
  compiler:
    name: Compiler progress watchdog
    runs-on: macos-14
    timeout-minutes: 10
    env:
      DIAGNOSTIC_VARIANT: watchdog
      PANACKELTY_BOOTSTRAP_ROOT: .
      VALIDATION_JOBS: 1
    steps:
      - uses: actions/checkout@v6
      - name: Prepare native VM and concurrent workload
        run: |
          make native native-module-build native-fault-build
          mkdir -p diagnostics
          # Used only by the concurrent sibling suite.
          ./bin/panack compile src/compiler/main.panack -o diagnostics/compiler.bc
          echo "PANACK_TEST_COMPILER=$PWD/diagnostics/compiler.bc" >> "$GITHUB_ENV"
          sw_vers
          sysctl hw.ncpu hw.memsize
      - name: Apply temporary phase timing instrumentation
        run: |
          ruby tests/experiments/nightly-diagnostics/instrument.rb
          make native
      - name: Prove progress accounting and forced cleanup
        run: node --test tests/experiments/nightly-diagnostics/watchdog.test.cjs
      - name: Prove real compiler stalls are detected
        run: node tests/experiments/nightly-diagnostics/compiler-watchdog.cjs faults
      - name: Run the compiler source command alone
        id: alone
        run: node tests/experiments/nightly-diagnostics/compiler-watchdog.cjs alone
      - name: Run the compiler source command alongside runtime probes
        if: always() && steps.alone.outcome != 'skipped'
        run: node tests/experiments/nightly-diagnostics/compiler-watchdog.cjs concurrent
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compiler-watchdog-${{ github.run_id }}
          path: |
            diagnostics/**/result.json
            diagnostics/**/*.log
            diagnostics/**/*.tsv
            diagnostics/**/*.stdout
            diagnostics/**/*.stderr
          retention-days: 14
          if-no-files-found: warn
