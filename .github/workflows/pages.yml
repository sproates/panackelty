name: Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_website:
        description: 'Explicitly rebuild the prepared website artifact (maintenance/cold measurement)'
        type: boolean
        default: false

permissions:
  contents: read

# One serialized website writer. Coverage has its own repository and publisher.
# Ignore obsolete automatic triggers; require successful exact-main validation.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Prepare Pages
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_SOURCE: '.'
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      site_sha: ${{ steps.source.outputs.site_sha }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
      browser: ${{ steps.reuse.outputs.browser }}
      checked_run: ${{ steps.reuse.outputs.checked_run }}
    steps:
      - name: Check out trusted publisher (or PR for unprivileged tests)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify before any website work
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; then
            plan=$(bash scripts/ci_scope.sh --plan "$CI_BASE_SHA" "$CI_HEAD_SHA")
            # Check owns all applicable website validation. Its main completion
            # triggers publication of the checked artifact, without a second run.
            if printf '%s\n' "$plan" | grep -qx 'pages=true'; then
              plan=$(printf '%s\n' "$plan" | sed 's/^pages=true$/pages=false/')
            fi
            printf '%s\n' "$plan" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = workflow_run ] && [ "$TRIGGER_SHA" != "$(git rev-parse HEAD)" ]; then
            echo 'pages=false' >> "$GITHUB_OUTPUT"
          else
            echo 'pages=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Pin current website source before parallel validation
        if: steps.scope.outputs.pages == 'true' && (github.event_name != 'pull_request')
        id: source
        run: echo "site_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.pages == 'true'
        with:
          node-version: '24'

      - name: Fingerprint selected website inputs
        if: steps.scope.outputs.pages == 'true'
        id: fingerprint
        run: |
          cd "$SITE_SOURCE"
          echo "value=$(bash scripts/pages_fingerprint.sh HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find previously validated production website
        if: steps.scope.outputs.pages == 'true'
        id: reuse
        uses: actions/github-script@v8
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
          FORCE_REBUILD: ${{ github.event_name == 'pull_request' || inputs.rebuild_website == true }}
          EVENT_NAME: ${{ github.event_name }}
          SITE_SHA: ${{ steps.source.outputs.site_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const automatic = process.env.EVENT_NAME === 'workflow_run';
            const artifact = await require('./scripts/pages_candidate.cjs')(github, context.repo, {
              sha: process.env.SITE_SHA, fingerprint: process.env.FINGERPRINT,
              automatic, rebuild: process.env.FORCE_REBUILD === 'true',
            }, message => core.info(message));
            if (automatic && !artifact) {
              core.info('No checked website: core/docs-only Check needs no website publication');
              return;
            }
            if (artifact?.check_run_id) core.info('Restoring website validated by the exact successful main Check');
            if (artifact && automatic) {
              const selected = await require('./scripts/pages_source.cjs')(github, context.repo);
              if (await require('./scripts/pages_duplicate.cjs')(selected, process.env.SITE_SHA)) {
                core.info('This validated website is already live');
                return;
              }
            }
            core.setOutput('browser', artifact ? 'false' : 'true');
            if (artifact?.check_run_id) core.setOutput('checked_run', String(artifact.check_run_id));
            if (artifact) {
              const archive = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: 'zip',
              });
              fs.writeFileSync(`${process.env.RUNNER_TEMP}/website.zip`, Buffer.from(archive.data));
            }

      - name: Test source selection and website navigation
        if: steps.reuse.outputs.browser != ''
        run: node --test tests/pages.test.cjs tests/playground_release.test.cjs tests/preview.test.cjs

      - name: Test complete site assembly
        if: steps.reuse.outputs.browser != ''
        run: sh tests/pages.sh

      - name: Restore validated website bytes without browser provisioning
        if: steps.scope.outputs.pages == 'true' && (steps.reuse.outputs.browser == 'false')
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          mkdir -p build/website
          unzip -q "$RUNNER_TEMP/website.zip" -d "$RUNNER_TEMP/validated-website"
          tar -xf "$RUNNER_TEMP/validated-website/website.tar" -C build/website
          test "$(cat build/website/.validation-fingerprint)" = "$FINGERPRINT"
          node scripts/check_pages.cjs build/website
          test -z "$(find build/website -type l -print)"

      - name: Fetch pinned release and assemble changed website
        if: steps.scope.outputs.pages == 'true' && (steps.reuse.outputs.browser == 'true')
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          if [ "$IS_PR" = true ]; then
            node scripts/preview.cjs build build/website
          else
            node scripts/fetch_playground.cjs "$SITE_SOURCE/site/playground.json" build/playground
            sh scripts/assemble_site.sh "$SITE_SOURCE/site" build/playground build/website
          fi
          printf '%s\n' "$FINGERPRINT" > build/website/.validation-fingerprint

      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.pages == 'true' && steps.reuse.outputs.browser != ''
        with:
          name: pages-candidate
          path: build/website
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  browser:
    needs: build
    if: needs.build.outputs.browser == 'true'
    uses: ./.github/workflows/browser-validation.yml
    permissions:
      contents: read
      actions: read

  publish:
    name: Package tested Pages
    needs: [build, browser]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      ((needs.build.outputs.browser == 'true' && needs.browser.result == 'success') ||
       (needs.build.outputs.browser == 'false' && needs.browser.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.site_sha || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pages-candidate
          path: build/website
      - name: Require successful Check for the pinned website source
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        env:
          SITE_SHA: ${{ needs.build.outputs.site_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const selectSource = require('./scripts/pages_source.cjs');
            const awaitSource = require('./scripts/pages_ready.cjs');
            const {site} = await awaitSource(
              () => selectSource(github, context.repo), process.env.SITE_SHA);
            fs.writeFileSync('build/website/publication.json', JSON.stringify({
              schema: 1, site_sha: site.head_sha, check_run: site.id,
            }, null, 2) + '\n');
            await core.summary.addHeading('Validated website source')
              .addRaw(`Website: ${site.head_sha}\n\nCheck: ${site.id}\n`).write();

      - name: Check assembled website navigation
        run: node scripts/check_pages.cjs build/website

      - name: Archive reusable website after successful browser validation
        if: github.event_name != 'pull_request'
        run: |
          mkdir reusable
          tar -cf reusable/website.tar -C build/website .
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: validated-website-${{ needs.build.outputs.fingerprint }}
          path: reusable/website.tar
          retention-days: 90
          if-no-files-found: error

      - name: Archive tested PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: website-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/website
          retention-days: 7
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/website

  deploy:
    name: Deploy Pages
    if: "!cancelled() && github.event_name != 'pull_request' && needs.publish.result == 'success'"
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify published website
    if: "!cancelled() && needs.build.result == 'success' && needs.deploy.result == 'success'"
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: published-artifact
      - name: Check deployed website, playground and provenance
        run: |
          mkdir published
          tar -xf published-artifact/artifact.tar -C published
          for attempt in 1 2 3 4 5; do
            if node scripts/check_pages.cjs published https://panackelty.com/; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  timings:
    name: Pages timings
    needs: [build, browser, publish, deploy, verify]
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          SITE_SHA: ${{ needs.build.outputs.site_sha }}
          CHECKED_RUN: ${{ needs.build.outputs.checked_run }}
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:context.runId});
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id:context.runId, filter:'latest', per_page:100,
            });
            let mergedAt;
            if (process.env.SITE_SHA) {
              const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref:process.env.SITE_SHA});
              mergedAt=commit.commit.committer.date;
            }
            let checked;
            if (process.env.CHECKED_RUN) {
              const run_id=Number(process.env.CHECKED_RUN);
              const {data: source}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              const sourceJobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo,run_id,filter:'latest',per_page:100,
              });
              checked={run:source,jobs:sourceJobs,trigger_id:context.payload.workflow_run?.id};
            }
            const result=require('./scripts/pages_timings.cjs')(run,jobs,mergedAt,process.env.SITE_SHA,checked);
            await core.summary.addHeading('Website validation timings')
              .addCodeBlock(JSON.stringify(result,null,2),'json')
              .addRaw('Budgets: validation 120s; merge-to-live 180s. Checked-website publications include their originating Check validation through Pages packaging; this combined value is a conservative wall bound without inter-job queue subtraction. Other runs report observed pre-step dispatch separately. Image pulls and transfers stay included. First-attempt exact-source push/publication pairs alone report merge-to-live wall time. Queue-excluded merge latency remains unmeasured; manual refreshes, duplicates, reruns and failed verification cannot establish it.\n')
              .write();
            if (result.validation_seconds>120 || result.merge_to_live_wall_seconds>180) {
              core.warning('Website timing budget exceeded; retain all tests and investigate the phase timings.');
            }
