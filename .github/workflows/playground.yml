name: Playground preparation
on:
  pull_request:
    paths: ['site/**', 'src/vm/**', 'src/playground/**', 'src/stdlib/**', 'bootstrap/**', 'tests/playground/**', 'scripts/install_wasi_sdk.sh', '.github/workflows/playground.yml']
  push:
    branches: [main]
    paths: ['site/**', 'src/vm/**', 'src/playground/**', 'src/stdlib/**', 'bootstrap/**', 'tests/playground/**', 'scripts/install_wasi_sdk.sh', '.github/workflows/playground.yml']
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned native WASI toolchain
        run: |
          sh scripts/install_wasi_sdk.sh "$RUNNER_TEMP/playground-sdk"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/playground-sdk/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm run setup --prefix src/playground
      - name: Build and prove deterministic Wasm output
        run: |
          npm run build --prefix src/playground
          cp build/playground/assets/*/vm.wasm "$RUNNER_TEMP/first.wasm"
          cp build/playground/asset-version.txt "$RUNNER_TEMP/first-version.txt"
          npm run build --prefix src/playground
          cmp "$RUNNER_TEMP/first.wasm" build/playground/assets/*/vm.wasm
          cmp "$RUNNER_TEMP/first-version.txt" build/playground/asset-version.txt
      - name: Native CLI comparison and runtime contracts
        run: |
          make native
          npm test --prefix src/playground
      - name: Install browser engines
        run: node build/playground-tools/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Actual browser worker tests
        run: npm run test:browser --prefix src/playground
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser-failures
          path: src/playground/test-results
