name: Playground preparation
on:
  pull_request:
    paths: ['src/vm/**', 'src/playground/**', 'src/stdlib/**', 'bootstrap/**', 'tests/playground/**', '.github/workflows/playground.yml']
  push:
    branches: [main]
    paths: ['src/vm/**', 'src/playground/**', 'src/stdlib/**', 'bootstrap/**', 'tests/playground/**', '.github/workflows/playground.yml']
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned native WASI toolchain
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi.tar.gz"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $RUNNER_TEMP/wasi.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm run setup --prefix src/playground
      - name: Build and prove deterministic Wasm output
        run: |
          npm run build --prefix src/playground
          cp build/playground/vm.wasm "$RUNNER_TEMP/first.wasm"
          npm run build --prefix src/playground
          cmp "$RUNNER_TEMP/first.wasm" build/playground/vm.wasm
      - name: Native CLI comparison and runtime contracts
        run: |
          make native
          npm test --prefix src/playground
      - name: Install browser engines
        run: node build/playground-tools/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Actual browser worker tests
        run: npm run test:browser --prefix src/playground
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser-failures
          path: src/playground/test-results
