name: Validation profile
on: workflow_dispatch
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev zlib1g-dev libssl-dev
      - name: Build the same observer and sanitizers as promotion CI
        run: make CC=clang BUILD_DIR=build/sanitize CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" LDFLAGS="-fsanitize=address,undefined" compiler-watchdog-build
      - name: Measure the complete self-compilation fixture
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          export PANACKELTY_STDLIB_PATH="$PWD/src/stdlib" PANACKELTY_BOOTSTRAP_ROOT="$PWD"
          mkdir evidence
          build/sanitize/vm/compiler-watchdog 600 evidence build/sanitize/vm/compiler-observer-vm run bootstrap/compiler-v9.bc run src/compiler/main.panack > actual.stdout
          cmp tests/functional/cases/compiler_skeleton/expected.stdout actual.stdout
          awk -F '\t' '$2=="return" && $3 ~ /check_module_bodies_explained$/ && $8 ~ /module_bodies.panack$/ {print "module_wall_seconds=" $6, "module_cpu_seconds=" $7}' evidence/run.*/progress.tsv
          cat evidence/run.*/result.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sanitizer-timing-${{ matrix.sample }}
          path: evidence/
