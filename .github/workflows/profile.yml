name: Validation profile

# This profiling workflow runs six component checks across two platforms and
# can take a long time. Run it on demand; PRs use the regular Check workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Warm profile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      # Keep the profiling workload stable when local Make defaults change.
      VALIDATION_JOBS: 2
      VALIDATION_PROFILE_FILE: ${{ github.workspace }}/validation-profile.tsv
      VALIDATION_TIMINGS_FILE: ${{ github.workspace }}/validation-timings.tsv
    steps:
      - uses: actions/checkout@v6
      - name: Install native HTTP client dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev
      - name: Build ordinary native prerequisites
        env:
          VALIDATION_PROFILE_RUN: preparation
        run: make native native-module-build native-fault-build
      - name: Measure initial and cached focused checks
        shell: bash
        run: |
          status=0
          for component in compiler bytecode vm; do
            for state in initial cached; do
              VALIDATION_PROFILE_RUN="$state-$component" \
                sh tests/profile_command.sh "$state/check-$component" \
                make "check-$component" || status=1
            done
          done
          exit "$status"
      - name: Record environment
        if: always()
        shell: bash
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            cc --version
          } > profile-environment.txt
      - name: Archive focused profiles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: focused-profile-${{ matrix.target }}-${{ github.run_id }}
          path: |
            validation-profile.tsv
            validation-timings.tsv
            profile-environment.txt
          if-no-files-found: warn
