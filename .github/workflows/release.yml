name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Confirm VERSION (for example 0.1.0-alpha.9)"
        required: true
        type: string
      commit:
        description: "Confirm the full 40-character main commit to release"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require confirmed release identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh scripts/release_request.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" \
            "$GITHUB_SHA" "$REQUESTED_VERSION" "$REQUESTED_COMMIT" > "$RUNNER_TEMP/release-notes.md"

      - name: Run the complete project validation
        run: make check

  package:
    needs: validate
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Build and verify the native release package
        run: make package

      - name: Record build provenance
        shell: bash
        run: |
          archive=$(find build -maxdepth 1 -name 'panackelty-*.tar.gz' -print -quit)
          checksum=$(awk '{print $1}' "${archive}.sha256")
          {
            echo "archive=$(basename "$archive")"
            echo "sha256=$checksum"
            echo "source_commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
          } >"${archive}.provenance"

      - name: Retain validated release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-package-${{ matrix.target }}
          path: |
            build/panackelty-*.tar.gz
            build/panackelty-*.tar.gz.sha256
            build/panackelty-*.tar.gz.provenance
          if-no-files-found: error

  publish:
    needs: [validate, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download validated release assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Verify the complete release asset set
        shell: bash
        run: |
          version=$(cat VERSION)
          cd release-assets
          for target in linux-x86_64 macos-arm64; do
            archive="panackelty-${version}-${target}.tar.gz"
            test -f "$archive"
            test -f "${archive}.sha256"
            test -f "${archive}.provenance"
            sha256sum -c "${archive}.sha256"
            digest=$(sha256sum "$archive" | awk '{print $1}')
            grep -Fx "archive=$archive" "${archive}.provenance"
            grep -Fx "sha256=$digest" "${archive}.provenance"
            grep -Fx "source_commit=$GITHUB_SHA" "${archive}.provenance"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Create or verify the annotated tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh scripts/release_request.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" \
            "$GITHUB_SHA" "$REQUESTED_VERSION" "$REQUESTED_COMMIT" > "$RUNNER_TEMP/release-notes.md"
          expected_tag="v$(cat VERSION)"
          # Fetch is required to distinguish an absent tag from a network failure.
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$expected_tag"; then
            test "$(git cat-file -t "refs/tags/$expected_tag")" = tag
            test "$(git rev-parse "refs/tags/$expected_tag^{}")" = "$GITHUB_SHA"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            git -c user.name=sproates \
              -c user.email=218187+sproates@users.noreply.github.com \
              tag -a "$expected_tag" "$GITHUB_SHA" -F "$RUNNER_TEMP/release-notes.md"
            gh auth setup-git
            git push origin "refs/tags/$expected_tag"
          fi
          # A token-created tag does not trigger another run: publish here, after
          # the same validation/package gates. Never edit an existing release.
          gh release create "$expected_tag" release-assets/* \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Panackelty ${expected_tag#v}" \
            --notes-from-tag
