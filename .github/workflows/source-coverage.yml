name: Source coverage

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-coverage-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  schedule_next:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Schedules execute from main; dispatch next so run and artifact identity
      # both describe the exact measured next commit.
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'source-coverage.yml', ref: 'next'
            });

  collect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install native HTTP client dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev zlib1g-dev libssl-dev

      - name: Build native source collector
        run: make native
      - name: Validate bounded reader and SC4 source parity
        run: |
          node --test tests/source_coverage/reader.test.cjs tests/source_coverage/cache.test.cjs tests/source_coverage/hosted.test.cjs tests/source_coverage/manifest.test.cjs tests/source_coverage/policy.test.cjs tests/source_coverage/release_gate.test.cjs
          node tests/source_coverage/parity.cjs
      - name: Identify reusable preparation
        id: preparation
        continue-on-error: true
        run: node scripts/source_coverage_hosted.cjs identity
      - name: Select successful next preparation producer
        id: producer
        if: steps.preparation.outputs.name != ''
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PREPARATION_NAME: ${{ steps.preparation.outputs.name }}
        with:
          script: |
            const {select} = require('./scripts/source_coverage_hosted.cjs');
            const producer = await select(github, process.env.PREPARATION_NAME, context.runId);
            if (producer) {
              core.info(JSON.stringify(producer));
              core.setOutput('artifact', producer.artifact);
              core.setOutput('run', producer.run);
            } else core.info('No matching successful preparation; generating fresh plans');
      - name: Download exact preparation artifact
        id: download_preparation
        timeout-minutes: 5
        if: steps.producer.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact }}
          run-id: ${{ steps.producer.outputs.run }}
          github-token: ${{ github.token }}
          repository: sproates/panackelty
          path: ${{ runner.temp }}/source-preparation-download
          digest-mismatch: error
      - name: Validate and locally authenticate downloaded preparation
        if: steps.download_preparation.outcome == 'success'
        env:
          PREPARATION_DOWNLOAD: ${{ runner.temp }}/source-preparation-download
        run: node scripts/source_coverage_hosted.cjs import "$PREPARATION_DOWNLOAD"
      - name: Collect exact source baseline
        run: node scripts/source_coverage_baseline.cjs
      - name: Archive separately identified source report
        uses: actions/upload-artifact@v6
        with:
          name: source-coverage-${{ github.run_id }}
          path: build/source-coverage
          if-no-files-found: error
          retention-days: 90
      # Separate from the static publisher's source-coverage-RUN_ID artifact.
      # Upload only payloads: never source-plan-trust, sessions, or raw counters.
      - name: Retain reusable preparation
        if: success() && steps.preparation.outputs.name != ''
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.preparation.outputs.name }}
          path: build/source-plan-cache
          if-no-files-found: error
          retention-days: 30
